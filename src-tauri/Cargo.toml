[package]
name = "garite"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# macOS: 맨 앞 앱을 NSWorkspace로 읽는다 (권한 불필요). 이미 tauri가 쓰는 크레이트라 추가 크기 없음.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }

# 자동 업데이트. 기본 기능의 `zip`은 끈다: zip 크레이트 4.x는 보안 문제로 전부 yanked라 의존성 해석이 실패하고,
# 이 앱은 Windows에서도 .zip 업데이트 묶음(v1 호환)을 쓰지 않는다(v2 형식은 설치 파일을 직접 사용).
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2.4"
